[project]
name = "metupy-core"
version = "0.1.4"
description = "Lightweight Python Static Site & Documentation Generator — fast, component-driven, multi-language, zero JS build tools."
readme = "README.md"
requires-python = ">=3.10"
keywords = [
    "static-site-generator",
    "documentation-generator",
    "markdown-to-html",
    "ssg",
    "docs-as-code",
    "i18n",
    "python-framework",
    "metupy",
]

authors = [
    { name = "palembangPy", email = "palembangpy@gmail.com" }
]
maintainers = [
    { name = "tomsdroid", email = "tomsdroid007@gmail.com" }
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Documentation",
    "Topic :: Text Processing :: Markup :: Markdown",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
]

dependencies = [
    "chardet>=7.6.0",
    "deep-translator>=1.11.0",
    "docutils>=0.23",
    "jinja2>=3.1.6",
    "lark>=1.3.1",
    "markdown>=3.5.0",
    "peewee>=4.4.0",
    "pluggy>=1.6.0",
    "pygments>=2.21.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
]

[project.urls]
Homepage = "https://metupy.com"
Documentation = "https://docs.metupy.com/"
Repository = "https://github.com/metupy/metupy-core"
Issues = "https://github.com/metupy/metupy-core/issues"

[build-system]
requires = ["flit-core>=3.10,<4"]
build-backend = "flit_core.buildapi"
