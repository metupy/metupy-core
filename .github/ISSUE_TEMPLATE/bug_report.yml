name: Bug Report
description: Report a problem or unexpected behavior
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    attributes:
      label: Describe the Bug
      description: Clear and concise description of what went wrong.
    validations:
      required: true

  - type: textarea
    attributes:
      label: Steps to Reproduce
      description: List the steps to reproduce the behavior.
      placeholder: |
        1. Run '...'
        2. Then '...'
        3. See error
    validations:
      required: true

  - type: textarea
    attributes:
      label: Expected Behavior
      description: What should happen instead?
    validations:
      required: true

  - type: input
    attributes:
      label: Version
      description: Which version of Metupy Core are you using?
    validations:
      required: true

  - type: textarea
    attributes:
      label: Additional Information
      description: Screenshots, error messages, or anything else relevant.
