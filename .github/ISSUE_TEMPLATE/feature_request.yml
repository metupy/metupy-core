name: Feature Request
description: Suggest a new idea or improvement
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    attributes:
      label: Describe the Feature
      description: Clear and concise description of what you want.
    validations:
      required: true

  - type: textarea
    attributes:
      label: Problem to Solve
      description: What problem does this feature solve?
    validations:
      required: true

  - type: textarea
    attributes:
      label: Example Usage
      description: Show how this would look in use.
      placeholder: |
        page = Page(title="Home")
        page.something_new()
    validations:
      required: false

  - type: textarea
    attributes:
      label: Additional Context
      description: Any other info or ideas.
    validations:
      required: false
